[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phred-consensus"
version = "1.0.1"
description = "Phred-aware Bayesian consensus calling for aligned reads"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Bert Mouler" }]
keywords = ["bioinformatics", "consensus", "phred", "bayesian"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "mypy>=1.14",
  "mutmut>=3.7",
  "ruff>=0.9",
]

[project.scripts]
phred-consensus = "phred_consensus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/phred_consensus"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["phred_consensus"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.11"

[tool.mutmut]
source_paths = ["src/phred_consensus"]
